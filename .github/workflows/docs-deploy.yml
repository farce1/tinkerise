name: Docs Deploy

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'apps/docs/package.json'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
      - '.github/workflows/docs-deploy.yml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate changelog data
        run: bun run --filter @tinkerise/docs docs:changelog

      - name: Build docs
        run: bun run docs:build

      - name: Verify docs output directory
        run: test -d apps/docs/dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4

  smoke:
    name: Post-deploy docs smoke checks
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium runtime
        run: bunx playwright install --with-deps chromium

      - name: Explain smoke target strategy (deploy URL + canonical fallback)
        run: |
          echo "Smoke checks run against the deployed URL from this workflow run."
          echo "Smoke checks also include canonical URL verification when configured by the script."

      - name: Run docs smoke checks against deployed production targets (blocking)
        run: |
          mkdir -p apps/docs/scripts/artifacts
          set -o pipefail
          bun run --filter @tinkerise/docs docs:smoke 2>&1 | tee apps/docs/scripts/artifacts/docs-smoke.log
        env:
          DEPLOY_URL: ${{ needs.deploy.outputs.page_url }}
          CANONICAL_URL: ${{ vars.DOCS_CANONICAL_URL }}

      - name: Upload smoke report artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-smoke-report-${{ github.run_id }}
          path: apps/docs/scripts/artifacts/docs-smoke-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload smoke failure evidence bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-smoke-failure-evidence-${{ github.run_id }}
          path: |
            apps/docs/scripts/artifacts/docs-smoke.log
            apps/docs/scripts/artifacts/docs-smoke-report.json
            apps/docs/scripts/artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 14
