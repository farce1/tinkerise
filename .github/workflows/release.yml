name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-reliability-preflight:
    name: Release Reliability Preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run CLI runtime conformance gate
        run: bun run --filter @tinkerise/cli test:conformance

      - name: Run docs preview smoke gate
        run: bun run reliability:docs-preview-smoke

      - name: Generate reliability closure bundle
        run: bun run reliability:closure

      - name: Upload release reliability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-reliability-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            packages/cli/tests/conformance/artifacts/runtime-error-report.json
            apps/docs/scripts/artifacts/docs-smoke-report.json
            .artifacts/reliability/v3.1/closure-index.json
            .artifacts/reliability/v3.1/closure-checklist.md

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: release-reliability-preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine whether release should run
        id: release_gate
        run: |
          set -euo pipefail

          pending_changesets=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')

          before_sha='${{ github.event.before }}'
          if [ -z "$before_sha" ] || [ "$before_sha" = '0000000000000000000000000000000000000000' ]; then
            changed_files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          else
            changed_files=$(git diff --name-only "$before_sha" "$GITHUB_SHA")
          fi

          changelog_touched=false
          if printf '%s\n' "$changed_files" | grep -E '^packages/[^/]+/CHANGELOG\.md$' >/dev/null; then
            changelog_touched=true
          fi

          should_release=false
          reason='no pending changesets and no package changelog updates in this push'

          if [ "$pending_changesets" -gt 0 ]; then
            should_release=true
            reason="found ${pending_changesets} pending changeset(s)"
          elif [ "$changelog_touched" = true ]; then
            should_release=true
            reason='package changelog changes detected in this push'
          fi

          echo "should_release=${should_release}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      - name: Skip release on non-release pushes
        if: steps.release_gate.outputs.should_release != 'true'
        run: |
          echo "Skipping release workflow: ${{ steps.release_gate.outputs.reason }}"

      - name: Setup Bun
        if: steps.release_gate.outputs.should_release == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.9

      - name: Setup Node.js
        if: steps.release_gate.outputs.should_release == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        if: steps.release_gate.outputs.should_release == 'true'
        run: bun install --frozen-lockfile

      - name: Build
        if: steps.release_gate.outputs.should_release == 'true'
        run: bun run build

      - name: Validate publish preconditions
        if: steps.release_gate.outputs.should_release == 'true'
        run: |
          set -euo pipefail

          pending_changesets=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          if [ "$pending_changesets" -gt 0 ]; then
            echo "Found $pending_changesets pending changeset(s); changesets/action will open or update the version PR."
            exit 0
          fi

          if grep -R --include='package.json' '"workspace:' packages/ >/dev/null; then
            echo "::error title=Initial release blocked::No pending changesets were found, but workspace protocol dependencies are still present."
            echo "::error::Create and merge an initial changeset version PR before publish so internal workspace dependencies are rewritten to concrete semver ranges."
            exit 1
          fi

      - name: Create Release PR or Publish
        if: steps.release_gate.outputs.should_release == 'true'
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run ci:version
          publish: bun run ci:publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Normalize published release notes
        if: steps.release_gate.outputs.should_release == 'true' && steps.changesets.outputs.published == 'true'
        run: bun run ci:release:normalize
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Trigger Homebrew tap update
        if: steps.release_gate.outputs.should_release == 'true' && steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(jq -r '.version' packages/tinkerise/package.json)
          gh workflow run update-formula.yml \
            -R farce1/homebrew-tap \
            -f version="$VERSION"
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
