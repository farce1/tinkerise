name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Validate publish preconditions
        run: |
          set -euo pipefail

          pending_changesets=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | wc -l | tr -d ' ')
          if [ "$pending_changesets" -gt 0 ]; then
            echo "Found $pending_changesets pending changeset(s); changesets/action will open or update the version PR."
            exit 0
          fi

          if grep -R --include='package.json' '"workspace:' packages/ >/dev/null; then
            echo "::error title=Initial release blocked::No pending changesets were found, but workspace protocol dependencies are still present."
            echo "::error::Create and merge an initial changeset version PR before publish so internal workspace dependencies are rewritten to concrete semver ranges."
            exit 1
          fi

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run ci:version
          publish: bun run ci:publish
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Normalize published release notes
        if: steps.changesets.outputs.published == 'true'
        run: bun run ci:release:normalize
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Trigger Homebrew tap update
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION=$(jq -r '.version' packages/tinkerise/package.json)
          gh workflow run update-formula.yml \
            -R farce1/homebrew-tap \
            -f version="$VERSION"
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
