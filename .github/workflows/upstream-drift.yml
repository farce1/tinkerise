name: Upstream Flag Drift Detection

on:
  schedule:
    # Every Monday at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Check all tools even if one fails
      matrix:
        tool:
          - name: create-next-app
            cmd: npx create-next-app@latest --help
            snapshot: create-next-app.txt
          - name: create-vite
            cmd: npx create-vite@latest --help
            snapshot: create-vite.txt
          - name: create-astro
            cmd: npx create-astro@latest --help
            snapshot: create-astro.txt
          - name: create-t3-app
            cmd: npx create-t3-app@latest --help
            snapshot: create-t3-app.txt
          - name: create-react-router
            cmd: npx create-react-router@latest --help
            snapshot: create-react-router.txt
          - name: tanstack-cli
            cmd: npx @tanstack/cli create --help
            snapshot: tanstack-cli.txt
          - name: create-turbo
            cmd: npx create-turbo@latest --help
            snapshot: create-turbo.txt
          # Backend scaffolders
          - name: fastapi-admin
            cmd: fastapi-admin --help
            snapshot: fastapi-admin.txt
          - name: django-admin
            cmd: django-admin help startproject
            snapshot: django-admin.txt
          - name: go-blueprint
            cmd: go-blueprint --help
            snapshot: go-blueprint.txt
          - name: cargo-generate
            cmd: cargo generate --help
            snapshot: cargo-generate.txt
          - name: express-generator-typescript
            cmd: npx express-generator-typescript --help
            snapshot: express-generator-typescript.txt
          # Mobile scaffolders
          - name: flutter
            cmd: flutter create --help
            snapshot: flutter.txt
          - name: create-expo-app
            cmd: npx create-expo-app@latest --help
            snapshot: create-expo-app.txt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Go
        if: contains(matrix.tool.name, 'go-')
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install go-blueprint
        if: matrix.tool.name == 'go-blueprint'
        run: go install github.com/melkeydev/go-blueprint@latest

      - name: Set up Rust
        if: matrix.tool.name == 'cargo-generate'
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter
        if: matrix.tool.name == 'flutter'
        uses: subosito/flutter-action@v2

      - name: Install cargo-generate
        if: matrix.tool.name == 'cargo-generate'
        run: cargo install cargo-generate

      - name: Install fastapi-admin-cli
        if: matrix.tool.name == 'fastapi-admin'
        run: pip install --break-system-packages -q fastapi-admin-cli

      - name: Install django
        if: matrix.tool.name == 'django-admin'
        run: pip install --break-system-packages -q django

      - name: Capture help output
        run: ${{ matrix.tool.cmd }} > current-help.txt 2>&1 || true

      - name: Check for drift
        id: drift
        run: |
          SNAPSHOT=".github/snapshots/${{ matrix.tool.snapshot }}"
          if [ -f "$SNAPSHOT" ]; then
            if diff -u "$SNAPSHOT" current-help.txt > drift-diff.txt 2>&1; then
              echo "status=unchanged" >> "$GITHUB_OUTPUT"
              echo "No drift detected for ${{ matrix.tool.name }}"
            else
              echo "status=changed" >> "$GITHUB_OUTPUT"
              echo "Flag drift detected for ${{ matrix.tool.name }}!"
              echo ""
              cat drift-diff.txt
            fi
          else
            echo "status=new" >> "$GITHUB_OUTPUT"
            echo "No snapshot exists for ${{ matrix.tool.name }}"
          fi

      - name: Emit warning on drift
        if: steps.drift.outputs.status == 'changed'
        run: |
          echo "::warning title=Flag Drift Detected::${{ matrix.tool.name }} help output has changed. Review flag mappings in packages/core/src/registry/scaffolders/"

      - name: Create or update drift issue
        if: steps.drift.outputs.status == 'changed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Ensure drift label exists
          gh label create "drift" --description "Upstream tool drift detected" --color "FBCA04" 2>/dev/null || true

          TOOL="${{ matrix.tool.name }}"
          DATE=$(date +%Y-%m-%d)
          TITLE="Drift detected: ${TOOL} (${DATE})"
          TITLE_PREFIX="Drift detected: ${TOOL}"

          # Search for existing open issue with matching title prefix
          EXISTING=$(gh issue list --state open --search "in:title \"${TITLE_PREFIX}\"" --json number,title --jq ".[] | select(.title | startswith(\"${TITLE_PREFIX}\")) | .number" | head -1)

          # Build issue body
          DIFF_CONTENT=$(head -100 drift-diff.txt)
          BODY=$(printf '%s\n' \
            "## Drift Detected" \
            "" \
            "**Tool:** ${TOOL}" \
            "**Date:** ${DATE}" \
            "**Runner:** ${{ runner.os }} (${{ runner.arch }})" \
            "**CI Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "" \
            "### Diff" \
            "" \
            "\`\`\`diff" \
            "${DIFF_CONTENT}" \
            "\`\`\`" \
            "" \
            "> Review flag mappings in \`packages/core/src/registry/scaffolders/\`")

          if [ -n "$EXISTING" ]; then
            # Add comment to existing issue instead of creating duplicate
            gh issue comment "$EXISTING" --body "$BODY"
            echo "Updated existing issue #${EXISTING}"
          else
            # Create new issue with drift label
            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "drift"
          fi

      - name: Upload help output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: help-${{ matrix.tool.name }}
          path: current-help.txt
          retention-days: 30

      - name: Upload diff
        if: steps.drift.outputs.status == 'changed'
        uses: actions/upload-artifact@v4
        with:
          name: drift-${{ matrix.tool.name }}
          path: drift-diff.txt
          retention-days: 30

      - name: Fail if drift detected
        if: steps.drift.outputs.status == 'changed'
        run: |
          echo "::error::Drift detected for ${{ matrix.tool.name }} — see issue above"
          exit 1
