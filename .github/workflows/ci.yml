name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reliability-gates:
    name: Reliability Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Install fish shell (for completion conformance per D-17)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fish

      - name: Run CLI runtime conformance gate
        run: bun run --filter @tinkerise/cli test:conformance

      - name: Run docs preview smoke gate
        run: bun run reliability:docs-preview-smoke

      - name: Generate reliability closure bundle
        run: bun run reliability:closure

      - name: Upload reliability evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-gates-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            packages/cli/tests/conformance/artifacts/runtime-error-report.json
            apps/docs/scripts/artifacts/docs-smoke-report.json
            .artifacts/reliability/v3.1/closure-index.json
            .artifacts/reliability/v3.1/closure-checklist.md

  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        shell: bash

      - name: Build
        run: bun run build
        shell: bash

      - name: Type check
        run: bun run typecheck
        shell: bash

      - name: Lint
        run: bun run lint
        shell: bash

      - name: Test
        run: bun run test
        shell: bash

  license-check:
    name: License Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check licenses
        run: bun run license-check
