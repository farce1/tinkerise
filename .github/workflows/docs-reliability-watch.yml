# Scheduled docs reliability watch.
#
# Runs the docs production smoke suite weekly on an unfiltered schedule to catch
# regressions that the path-filtered docs-deploy.yml smoke gate cannot. On a
# failed run this workflow opens (or updates) a GitHub Issue with label
# `docs-reliability`. On a subsequent passing run it auto-closes every open
# matching issue. See REL-04 in .planning/REQUIREMENTS.md.
#
# Manual rerun:   gh workflow run docs-reliability-watch.yml
# Force failure:  gh workflow run docs-reliability-watch.yml -f force_failure=true
name: Docs Reliability Watch

on:
  schedule:
    # Thursday 09:00 UTC, weekly. Staggered from upstream-drift.yml's Monday
    # 09:00 UTC to spread reliability-watch coverage across the week (per D-08).
    - cron: '0 9 * * 4'
  workflow_dispatch:
    inputs:
      force_failure:
        description: 'Force a required-check failure for validation (Dimension 3/5)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write

concurrency:
  # Ref-agnostic, queue-not-cancel. Overlapping cron + manual dispatch QUEUE
  # rather than race. Eliminates the dedupe race that defensive multi-issue
  # auto-close (D-04, plan 02) is the secondary safety net for.
  group: docs-reliability-watch
  cancel-in-progress: false

jobs:
  scheduled-smoke:
    name: Scheduled production docs smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.1.9

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright Chromium runtime
        run: bunx playwright install --with-deps chromium

      # Required gate: any required smoke check failure must fail this workflow run.
      # `set -o pipefail` makes the `bun ... | tee` pipeline fail when bun fails
      # (without it, tee's exit code masks the failure).
      # The `--inject-required-failure` tail is appended only when the dispatch
      # input `force_failure` is true; cron runs always pass an empty string.
      - name: Run docs:smoke against canonical production URL (hard-fail gate)
        run: |
          mkdir -p apps/docs/scripts/artifacts
          set -o pipefail
          bun run --filter @tinkerise/docs docs:smoke -- --canonical-only ${{ inputs.force_failure && '--inject-required-failure' || '' }} 2>&1 \
            | tee apps/docs/scripts/artifacts/docs-smoke.log
        env:
          # Resolution order per D-02: prefer repo variable, fall back to the
          # canonical URL derived from apps/docs/astro.config.mjs:5-6
          # (site + base). The || expression short-circuits on empty string
          # (unset vars.X evaluates falsy).
          CANONICAL_URL: ${{ vars.DOCS_CANONICAL_URL || 'https://farce1.github.io/tinkerise/' }}

      - name: Upload smoke report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-smoke-report-${{ github.run_id }}
          path: apps/docs/scripts/artifacts/docs-smoke-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Upload smoke failure evidence (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-smoke-failure-evidence-${{ github.run_id }}
          path: |
            apps/docs/scripts/artifacts/docs-smoke.log
            apps/docs/scripts/artifacts/docs-smoke-report.json
            apps/docs/scripts/artifacts/screenshots/
          if-no-files-found: warn
          retention-days: 14

      # Failure path step 1 of 3: determine report state and build issue body.
      # FOUR branches per D-11 (priority order):
      #   1. report missing entirely      → minimal "no report produced" body
      #   2. report present but malformed → minimal "could not be parsed" body + artifact link
      #   3. report parses, zero failures → minimal "job failed after smoke passed" body
      #   4. report parses, >=1 failure   → full structured-summary body per D-10
      #
      # Multi-line output to $GITHUB_OUTPUT uses heredoc (echo body<<EOF ... EOF)
      # per RESEARCH §Pitfall 1 — single-line echo body=... truncates at \n.
      - name: Build issue body (failure path with three fallbacks)
        if: failure() && github.repository == 'farce1/tinkerise'
        id: body
        run: |
          REPORT="apps/docs/scripts/artifacts/docs-smoke-report.json"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Branch 1: file missing (pre-smoke failure: bun install / Playwright / crash)
          if [ ! -f "$REPORT" ]; then
            echo "state=missing" >> "$GITHUB_OUTPUT"
            {
              echo "body<<BODY_EOF"
              echo "## Docs reliability watch — smoke runner did not produce a report"
              echo ""
              echo "**Run:** ${RUN_URL}"
              echo "**State:** No \`docs-smoke-report.json\` was generated."
              echo ""
              echo "The smoke runner exited before writing its report. This usually means"
              echo "\`bun install\`, Playwright install, or the runner crashed during"
              echo "initialization. See run logs."
              echo ""
              echo "> See REL-04 in \`.planning/REQUIREMENTS.md\`."
              echo "BODY_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Branch 2: file exists but is not valid JSON. `jq empty` reads the entire
          # input and exits 0 only if it parses; prints nothing. Canonical
          # "is this valid JSON?" probe (per RESEARCH §Pitfall 3 / Anti-Patterns).
          if ! jq empty "$REPORT" >/dev/null 2>&1; then
            echo "state=malformed" >> "$GITHUB_OUTPUT"
            {
              echo "body<<BODY_EOF"
              echo "## Docs reliability watch — smoke report could not be parsed"
              echo ""
              echo "**Run:** ${RUN_URL}"
              echo "**State:** \`docs-smoke-report.json\` exists but is not valid JSON."
              echo ""
              echo "See run logs and the uploaded report artifact: \`docs-smoke-report-${{ github.run_id }}\`."
              echo ""
              echo "> See REL-04 in \`.planning/REQUIREMENTS.md\`."
              echo "BODY_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Branch 3: report parses but reports zero required failures while the
          # job failed. `// 0` defaults missing/null to 0 (per RESEARCH §Pitfall 3).
          FAILED=$(jq -r '.summary.failed // 0' "$REPORT")
          if [ "$FAILED" -eq 0 ]; then
            echo "state=job-failed-after-smoke-passed" >> "$GITHUB_OUTPUT"
            {
              echo "body<<BODY_EOF"
              echo "## Docs reliability watch — job failed after smoke checks passed"
              echo ""
              echo "**Run:** ${RUN_URL}"
              echo "**State:** \`docs-smoke-report.json\` reports zero required failures,"
              echo "but the job failed at a later step (likely artifact upload or another"
              echo "post-smoke step). The production docs themselves appear healthy."
              echo ""
              echo "See run logs for the actual failure."
              echo ""
              echo "> See REL-04 in \`.planning/REQUIREMENTS.md\`."
              echo "BODY_EOF"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Branch 4: structured summary (D-10). Render markdown table of failed
          # required checks using jq + awk for column alignment.
          echo "state=structured" >> "$GITHUB_OUTPUT"
          DATE=$(date -u +%Y-%m-%d)
          TARGET=$(jq -r '.targets[0] // "unknown"' "$REPORT")
          STARTED=$(jq -r '.startedAt // "unknown"' "$REPORT")

          FAILED_TABLE=$(jq -r '
            .checks
            | map(select(.status == "failed"))
            | (["Category", "Check ID", "Requirement(s)", "Target", "Error"]),
              (["---", "---", "---", "---", "---"]),
              (.[] | [.category, .id, ((.requirementIds // []) | join(",")), .target, (.error // "—")])
            | @tsv
          ' "$REPORT" | awk -F'\t' 'BEGIN{OFS=" | "} {print "| " $0 " |"}')

          {
            echo "body<<BODY_EOF"
            echo "## Docs reliability watch — scheduled smoke failed"
            echo ""
            echo "**Run:** ${RUN_URL}"
            echo "**Date (UTC):** ${DATE}"
            echo "**Target:** ${TARGET}"
            echo "**Smoke started at:** ${STARTED}"
            echo "**Commit on main:** ${{ github.sha }}"
            echo ""
            echo "### Failed required checks"
            echo ""
            echo "${FAILED_TABLE}"
            echo ""
            echo "### Why this matters"
            echo ""
            echo "This workflow runs the docs production smoke suite weekly on an"
            echo "unfiltered schedule to catch regressions that the path-filtered"
            echo "\`docs-deploy.yml\` smoke gate cannot. See REL-04 in"
            echo "\`.planning/REQUIREMENTS.md\`."
            echo ""
            echo "### Artifacts"
            echo ""
            echo "- Report: \`docs-smoke-report-${{ github.run_id }}\`"
            echo "- Failure evidence: \`docs-smoke-failure-evidence-${{ github.run_id }}\`"
            echo ""
            echo "Browse from the run page: ${RUN_URL}"
            echo "BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      # Failure path step 2 of 3: ensure label exists (idempotent).
      # Failure path step 3 of 3: search for existing open issue with matching
      # title prefix + docs-reliability label. Comment if found; create new
      # otherwise. Both branches use the body computed by `id: body` (task 1).
      #
      # Per RESEARCH §Pitfall 2: --search "in:title" is fuzzy (token-based);
      # the --jq client-side `startswith(...)` filter is the required exact
      # post-filter. Double-narrow with --label docs-reliability.
      - name: Create or update reliability-watch issue
        if: failure() && github.repository == 'farce1/tinkerise'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent label create (swallow "label already exists" non-zero
          # per RESEARCH §Pitfall 8 / upstream-drift.yml:157 pattern).
          gh label create "docs-reliability" \
            --description "Scheduled docs reliability watch detected a regression" \
            --color "B60205" 2>/dev/null || true

          DATE=$(date -u +%Y-%m-%d)
          TITLE_PREFIX="Docs reliability watch: scheduled smoke failed"
          TITLE="${TITLE_PREFIX} (${DATE})"
          BODY=$(cat <<'BODY_EOF'
          ${{ steps.body.outputs.body }}
          BODY_EOF
          )

          # Dedupe: fuzzy `in:title` search narrowed by --label, then a strict
          # client-side prefix filter. head -1 because at most one rolling
          # issue is expected (multi-issue defense lives on the success path).
          EXISTING=$(gh issue list \
            --state open \
            --label docs-reliability \
            --search "in:title \"${TITLE_PREFIX}\"" \
            --json number,title \
            --jq ".[] | select(.title | startswith(\"${TITLE_PREFIX}\")) | .number" \
            | head -1)

          if [ -n "$EXISTING" ]; then
            echo "Updating existing reliability-watch issue #${EXISTING}"
            gh issue comment "$EXISTING" --body "$BODY"
          else
            echo "Creating new reliability-watch issue"
            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "docs-reliability"
          fi

      # Success path: on a passing scheduled or dispatched run, enumerate ALL
      # open issues matching the title prefix + docs-reliability label and
      # close each with a "resolved by run #X" comment. Per D-04 defensive
      # enumeration — close ALL matches, not just head -1 — so any historical
      # duplicate (manual dupe / prior dedupe race) is cleaned up.
      #
      # Per RESEARCH §Pattern 2 anti-pattern: `gh issue close --comment ... --reason completed`
      # is a SINGLE atomic API call. Do NOT split into `gh issue comment`
      # followed by `gh issue close` — a transient API failure between the
      # two would leave the issue commented-but-still-open.
      - name: Auto-close any open reliability-watch issues
        if: success() && github.repository == 'farce1/tinkerise'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE_PREFIX="Docs reliability watch: scheduled smoke failed"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          MATCHES=$(gh issue list \
            --state open \
            --label docs-reliability \
            --search "in:title \"${TITLE_PREFIX}\"" \
            --json number,title \
            --jq ".[] | select(.title | startswith(\"${TITLE_PREFIX}\")) | .number")

          if [ -z "$MATCHES" ]; then
            echo "No open docs-reliability issues to close."
            exit 0
          fi

          echo "$MATCHES" | while read -r N; do
            [ -z "$N" ] && continue
            echo "Closing issue #${N}"
            gh issue close "$N" \
              --comment "Resolved by passing scheduled smoke run: ${RUN_URL}" \
              --reason completed
          done
