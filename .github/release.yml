changelog:
  categories:
    - title: Features
      labels:
        - feat
        - feature
        - enhancement
    - title: Fixes
      labels:
        - fix
        - bug
        - bugfix
    - title: Docs
      labels:
        - docs
        - documentation
    - title: Maintenance
      labels:
        - chore
        - build
        - ci
        - dependencies
        - refactor
        - '*'
